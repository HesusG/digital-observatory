# Wake-on-LAN sidecar — broadcasts magic packets on the host LAN so the
# observatory can wake d3r-ser before Ollama calls. Runs with host networking
# because Docker bridge networks NAT outgoing traffic and won't deliver to the
# broadcast address.
#
# Deploy on nano-spud:
#   cd /home/d3r/repos/digital-observatory/deploy/wol-service
#   cp .env.example .env  # fill in WOL_MAC / WOL_BROADCAST
#   docker compose up -d
#
# Test:
#   curl http://localhost:9999/healthz
#   curl -X POST http://localhost:9999/wake

services:
  wol:
    image: python:3.12-slim
    container_name: wol-service
    restart: unless-stopped
    network_mode: host
    command: ["python", "-u", "/app/wol_server.py"]
    volumes:
      - ./wol_server.py:/app/wol_server.py:ro
    environment:
      WOL_MAC: "${WOL_MAC}"
      WOL_BROADCAST: "${WOL_BROADCAST:-192.168.1.255}"
      WOL_PORT: "${WOL_PORT:-9999}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${WOL_PORT:-9999}/healthz').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
